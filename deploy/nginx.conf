# 多人时间表 · nginx 站点配置
#
# 用法（Ubuntu / Debian）：
#   ln -s /opt/multi-person-schedule/deploy/nginx.conf /etc/nginx/sites-enabled/scheduler
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 为什么不直接把配置敲进 /etc/nginx：
#   放在仓库里，改了什么有 diff 可查；换一台服务器也不用凭记忆重写。
#   服务器上留一个软链指回这里，两份配置就永远不会漂。
#
# 本文件在服务器上的实际位置是 /opt/multi-person-schedule/deploy/nginx.conf，
# 所以下面 root 写的绝对路径和仓库位置是对应的。

server {
    listen 80;
    server_name _;

    # 前端构建产物，由 `npm run build` 生成。
    # 它不进仓库（.gitignore 里有 dist/），必须在服务器上现构建。
    root /opt/multi-person-schedule/frontend/dist;
    index index.html;

    # 这个项目只有一个页面、没有前端路由，多余的路径直接 404 更好 ——
    # 万一路径写错能立刻看到错，而不是拿到一个“能打开但内容不对”的页面。
    location / {
        try_files $uri $uri/ =404;
    }

    # 所有 /api/ 开头的请求转给后端。
    #
    # ⚠️ proxy_pass 末尾不能加斜杠。
    #    写成 http://127.0.0.1:3001/ （多一个 /）时，nginx 会把 location /api/
    #    这段前缀替换掉，/api/free-slots 到后端就变成了 /free-slots，全部 404。
    #    报错看起来像“后端挂了”，其实是配置里一个字符。
    location /api/ {
        proxy_pass http://127.0.0.1:3001;

        # 反代的标准头。后端现在一个都没读，但没有它们，
        # 后端看到的所有来源 IP 都会是 127.0.0.1，日志和限流都没法做。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
